<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Access defaults — settings redesign</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --ink: #181a36;
      --muted: #5c5666;
      --rule: #e8e4ea;
      --pink: #e83e8c;
      --pink-deep: #be1463;
      --pink-soft: #fdf2f8;
      --page: #f7f6f8;
      --white: #ffffff;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; background: var(--page); color: var(--ink); font-family: Inter, system-ui, sans-serif; }
    button, input { font: inherit; }
    button { cursor: pointer; }

    .topbar {
      display: flex; align-items: center; gap: 16px;
      height: 64px; padding: 0 24px;
      background: var(--white); border-bottom: 1px solid var(--rule);
    }
    .mark {
      width: 32px; height: 32px; border-radius: 8px;
      background: var(--pink); color: #fff; font-weight: 700; font-size: 13px;
      display: grid; place-items: center;
    }
    .brand { font-size: 14px; font-weight: 700; }
    .brand small { display: block; font-size: 11px; font-weight: 500; color: var(--muted); }
    .search {
      flex: 1; max-width: 420px; margin-left: 24px;
      display: flex; align-items: center; height: 38px; padding: 0 12px;
      border: 1px solid var(--rule); border-radius: 10px;
      background: #fbfafc; color: #94a3b8; font-size: 13px;
    }
    .top-actions { margin-left: auto; display: flex; align-items: center; gap: 10px; color: #94a3b8; }
    .avatar {
      width: 32px; height: 32px; border-radius: 999px; background: var(--pink);
      color: #fff; font-size: 11px; font-weight: 700; display: grid; place-items: center;
    }

    .page { width: 100%; padding: 28px 32px 72px; }
    .crumb { font-size: 12px; color: #94a3b8; margin-bottom: 6px; }
    h1 { margin: 0; font-size: 22px; letter-spacing: -0.02em; }
    .lede { margin: 6px 0 0; color: var(--muted); font-size: 15px; }

    .tabs { display: flex; gap: 4px; margin-top: 20px; overflow-x: auto; padding: 4px; background: #eeeef2; border-radius: 12px; width: fit-content; max-width: 100%; }
    .tabs button {
      border: 0; background: transparent; color: #64748b;
      padding: 8px 14px; border-radius: 8px; font-size: 13px; font-weight: 600; white-space: nowrap;
    }
    .tabs button.on { background: #fff; color: var(--ink); }

    .panel {
      margin-top: 24px;
      background: var(--white);
      border: 1px solid var(--rule);
      border-radius: 12px;
      width: 100%;
    }
    .block { padding: 22px 24px 8px; }
    .block h2 {
      margin: 0 0 16px;
      font-size: 16px;
      font-weight: 600;
      letter-spacing: -0.01em;
    }
    .help { position: relative; display: inline-flex; }
    .help-btn {
      width: 18px; height: 18px; border-radius: 999px;
      border: 1px solid var(--rule); background: #fff; color: #94a3b8;
      font-size: 11px; font-weight: 700; line-height: 1; padding: 0;
    }
    .help-btn:hover, .help:focus-within .help-btn { color: var(--pink-deep); border-color: var(--pink); }
    .tip {
      display: none; position: absolute; left: 24px; top: -6px; z-index: 4;
      width: 240px; padding: 8px 10px; border-radius: 8px;
      background: var(--ink); color: #fff; font-size: 12px; font-weight: 400; line-height: 1.45;
    }
    .help:hover .tip, .help:focus-within .tip { display: block; }

    .row {
      display: grid;
      grid-template-columns: 168px minmax(0, 1fr);
      gap: 16px;
      align-items: start;
      padding: 4px 0 16px;
    }
    .row .lab {
      font-size: 14px;
      font-weight: 500;
      color: var(--ink);
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding-top: 14px;
    }
    .row .tip { left: 0; top: calc(100% + 6px); }

    .choices {
      border: 1px solid var(--rule);
      border-radius: 10px;
      overflow: hidden;
    }
    .choice {
      display: grid;
      grid-template-columns: 18px minmax(0, 1fr);
      gap: 12px;
      align-items: start;
      width: 100%;
      margin: 0;
      padding: 12px 14px;
      border: 0;
      border-bottom: 1px solid var(--rule);
      background: var(--white);
      text-align: left;
      color: inherit;
    }
    .choice:last-child { border-bottom: 0; }
    .choice:hover { background: #fbfafc; }
    .choice.on {
      background: var(--pink-soft);
    }
    .choice:focus-visible {
      outline: 2px solid rgb(232 62 140 / 0.45);
      outline-offset: -2px;
    }
    .dot {
      width: 16px; height: 16px; margin-top: 2px;
      border: 1.5px solid #c9c4ce; border-radius: 999px;
      background: #fff;
      position: relative;
    }
    .choice.on .dot { border-color: var(--pink); }
    .choice.on .dot::after {
      content: "";
      position: absolute;
      inset: 3px;
      border-radius: 999px;
      background: var(--pink);
    }
    .choice strong {
      display: block;
      font-size: 14px;
      font-weight: 600;
      letter-spacing: -0.01em;
    }
    .choice span {
      display: block;
      margin-top: 2px;
      font-size: 13px;
      font-weight: 400;
      color: var(--muted);
    }

    .foot {
      display: flex; align-items: center;
      padding: 16px 24px 22px;
      border-top: 1px solid var(--rule);
    }
    .primary {
      border: 0; background: var(--pink); color: #fff; border-radius: 8px;
      padding: 9px 16px; font-size: 13px; font-weight: 600;
    }
    .primary:hover { background: var(--pink-deep); }
  </style>
</head>
<body>
  <header class="topbar">
    <div class="mark">C</div>
    <div class="brand">Cleon <small>Document Management</small></div>
    <div class="search">Search documents, people, folders</div>
    <div class="top-actions">
      <span>Inbox</span>
      <span>Alerts</span>
      <div class="avatar">HR</div>
    </div>
  </header>

  <main class="page">
    <div class="crumb">Settings</div>
    <h1>Settings</h1>
    <p class="lede">Document types, access defaults, retention, roles, and Employee Files.</p>

    <div class="tabs">
      <button type="button">Document types</button>
      <button type="button" class="on">Access defaults</button>
      <button type="button">Retention</button>
      <button type="button">Help</button>
      <button type="button">Employee Files</button>
      <button type="button">Module roles</button>
    </div>

    <form class="panel" onsubmit="return false">
      <section class="block">
        <h2>New folders</h2>
        <div class="row">
          <div class="lab">
            Who can access
            <span class="help">
              <button type="button" class="help-btn" aria-label="About Who can access">?</button>
              <span class="tip">Used when someone creates a new organizational folder. Existing folders keep their own access.</span>
            </span>
          </div>
          <div class="choices" id="choices" role="radiogroup" aria-label="Who can access"></div>
        </div>
      </section>
      <div class="foot">
        <button type="submit" class="primary">Save</button>
      </div>
    </form>
  </main>

  <script>
    const OPTIONS = [
      { value: "all_staff", label: "All staff", desc: "Everyone in the company" },
      { value: "department", label: "Specific departments", desc: "Selected departments only" },
      { value: "grade", label: "Specific grades", desc: "Selected job grades only" },
      { value: "individual", label: "Specific employees", desc: "Named people only" },
      { value: "admin_only", label: "Admin only", desc: "Document managers only" },
    ];
    let selected = "all_staff";

    function render() {
      document.getElementById("choices").innerHTML = OPTIONS.map((option) => `
        <button
          type="button"
          class="choice ${option.value === selected ? "on" : ""}"
          role="radio"
          aria-checked="${option.value === selected}"
          data-value="${option.value}"
        >
          <i class="dot" aria-hidden="true"></i>
          <div>
            <strong>${option.label}</strong>
            <span>${option.desc}</span>
          </div>
        </button>
      `).join("");
    }

    document.getElementById("choices").addEventListener("click", (event) => {
      const button = event.target.closest("[data-value]");
      if (!button) return;
      selected = button.dataset.value;
      render();
    });

    render();
  </script>
</body>
</html>
